[package]
name = "RustClear"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.10.1"
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
anyhow = "1.0.100"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.18.1", features = ["v4"] }
rand = "0.9.2"
indoc = "2.0.6"
include_dir = "0.7.4"
blocks = { path = "crates/macros" }
chrono = "0.4.42"
rand_chacha = "0.9.0"
base64 = "0.22.1"
once_cell = "1.21.3"
bitflags = "2.5"

[profile.dev]
# `[profile.dev.package."*"]` below only ever optimized dependencies - the actual RustClear crate
# itself (world tick, pathfinding, etherwarp/entity physics, dungeon rebuild on /rs, etc. - most of
# what actually runs every tick) stayed at the default dev opt-level 0, unoptimized. That's the
# real source of broad, cross-system lag in a debug build, not any one bug. opt-level 3 here brings
# the crate's own code up to the same optimization release uses; `debug = true` (dev's own default)
# and incremental compilation stay on, so panics/backtraces still work and iterative rebuilds after
# a small change stay fast - full `lto`/`codegen-units = 1` (release's own settings) are
# deliberately NOT mirrored here, since those mostly help final binary performance at a steep
# rebuild-time cost, not the kind of thing worth paying on every edit-test cycle.
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
